[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pichu"
version = "0.1.3"
description = "⚡ pichu — code, compile, conquer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "pichu Contributors" }]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "click>=8.1.7",
    "ddgs>=8.1.1",
    "fastmcp>=2.12.0",
    "html2text>=2024.2.26",
    "httpx>=0.27.0",
    "lxml>=5.0",
    "openai>=1.52.0",
    "pathspec>=0.11.0",
    "platformdirs>=4.3.0",
    "playwright>=1.50.0",
    "pydantic>=2.9.0",
    "pypdf>=5.3.0",
    "prompt_toolkit>=3.0.50",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.9.0",
    "tomlkit>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2.post1",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "twine>=5.1.1",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
pichu = "pichu_main:main"

[tool.setuptools]
py-modules = ["pichu_main"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "agent*",
    "client*",
    "commands*",
    "config*",
    "context*",
    "hooks*",
    "prompts*",
    "safety*",
    "subagents*",
    "tools*",
    "ui*",
    "utils*",
]

[tool.setuptools.package-data]
subagents = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true

# ── uv configuration ─────────────────────────────────────
# lxml requires system libraries (libxml2-dev, libxslt1-dev) to build
# from source on Python versions without pre-built wheels.
# See .github/actions/setup-env/ for CI provisioning.
[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'", "sys_platform == 'win32'"]
