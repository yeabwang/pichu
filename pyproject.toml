[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pichu"
version = "0.1.0"
description = "⚡ Pichu — code, compile, conquer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Pichu Contributors" }]
dependencies = [
    "click>=8.1.7",
    "fastmcp>=2.12.0",
    "httpx>=0.27.0",
    "openai>=1.52.0",
    "pathspec>=0.11.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.9.0",
    "tomlkit>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2.post1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "twine>=5.1.1",
]
web = [
    "beautifulsoup4>=4.12.3",
    "ddgs>=8.1.1",
    "html2text>=2024.2.26",
    "playwright>=1.50.0",
    "pypdf>=5.3.0",
]

[project.scripts]
pichu = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = [
    "agent*",
    "client*",
    "commands*",
    "config*",
    "context*",
    "hooks*",
    "prompts*",
    "safety*",
    "sub_agents*",
    "tools*",
    "ui*",
    "utils*",
]

[tool.setuptools.package-data]
sub_agents = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
