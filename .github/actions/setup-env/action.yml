name: "Setup Python Environment"
description: "Installs uv (cached), Python, system build deps, and project dependencies"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.13"
  install-deps:
    description: "Run uv sync after setup"
    required: false
    default: "true"
  extras:
    description: "Extras to install (comma-separated)"
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    # ── Package manager ─────────────────────────────────
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true          # caches ~/.cache/uv across runs

    # ── Python runtime ──────────────────────────────────
    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    # ── System libraries for native extensions ──────────
    # lxml (via ddgs) requires libxml2 & libxslt headers to
    # compile from source when no binary wheel is available.
    - name: Install system build dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libxml2-dev libxslt1-dev zlib1g-dev

    # ── Project dependencies ────────────────────────────
    - name: Install project dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: uv sync --extra ${{ inputs.extras }}
