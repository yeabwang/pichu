name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_LINK_MODE: "copy"

jobs:
  # ── Pre-commit Parity ──────────────────────
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # ── Lint & Format ───────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  # ── Type Check ──────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Mypy
        run: uv run mypy src/agent/ src/client/ src/commands/ src/config/ src/context/ src/hooks/ src/safety/ src/subagents/ src/tools/ src/ui/ src/utils/ main.py

  # ── Tests ───────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Security Audit ─────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Bandit security check
        run: uv run ruff check --select S src/agent/ src/client/ src/commands/ src/config/ src/context/ src/hooks/ src/safety/ src/subagents/ src/tools/ src/ui/ src/utils/ main.py

  # ── Build ───────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [precommit, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          install-deps: "false"
      - name: Build sdist & wheel
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
